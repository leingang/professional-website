  interests: >-
    My graduate research was in symplectic geometry and moment maps, an
    abstraction of classical Hamiltonian dynamics with symmetry. My professional
    work is in mathematics education: teacher education, teaching methods, and
    technological tools in the classroom. From 2008 to 2025 I helped lead the
    department's service-level undergraduate program, first as Vice Chair for
    Undergraduate Affairs and then as Assistant Director for Undergraduate
    Studies, coordinating the calculus sequence, training teaching assistants
    and postdocs, and advising students.
