<html><body><div class="content"><p>For months an online <a href="http://blogs.discovermagazine.com/badastronomy/2008/03/29/no-the-lhc-wont-destroy-the-earth/">debate</a> has raged about whether the new <a href="http://en.wikipedia.org/wiki/Large_Hadron_Collider">Linear Hadron Collider</a> in Switzerland would create black holes that could "destroy the earth."</p>
<p>Well, the <a href="http://community.zdnet.co.uk/blog/0,1000000567,10009272o-2000331761b,00.htm">LHC is now online</a>, and apparently, it has not destroyed the earth.  Either that, or we're living in an episode of <cite>Lost</cite>.</p>
</div>
