<html><body><div class="content"><p>Like <a href="http://avizit.blogspot.com/2005/04/latex-row-height-in-tabular.html">Naradmuni</a>, I'm always forgetting the simple command to make the rows of a LaTeX table bigger.  </p>
<p></p><div class="geshifilter"><pre class="text geshifilter-text" style="font-family:monospace;">\renewcommand\arraystretch{MyValue}% (MyValue=1.0 is for standard spacing)</pre></div>
</div>
