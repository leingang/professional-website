# Build site/ (matthewleingang.com) and publish to GitHub Pages on every push
# to the master branch. In repo Settings → Pages, set Source = "GitHub Actions".
name: Publish matthewleingang.com
on:
  push:
    branches: [master]
    paths: ["site/**", "_shared/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: false
      - run: cp _shared/headshot.jpg site/images/headshot.jpg
      - run: quarto render site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
